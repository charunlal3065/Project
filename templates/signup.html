<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Performance Hub</title>
  <meta name="description" content="Create your free Performance Hub account and start analyzing your academic performance with AI.">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <canvas id="bg-canvas"></canvas>

  <div class="auth-card">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </div>
      <span class="auth-brand-name">Performance Hub</span>
    </div>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-subtitle">Start your AI-powered academic journey today</p>

    {% if error %}
    <div class="alert alert-error" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="signup-form" autocomplete="on">
      <div class="field">
        <input type="text" name="username" id="username" placeholder=" " required autocomplete="username" minlength="3">
        <label for="username">Username</label>
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
      </div>

      <div class="field">
        <input type="email" name="email" id="email" placeholder=" " required autocomplete="email">
        <label for="email">Email Address</label>
        <span class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </span>
      </div>

      <div class="field" style="margin-bottom:2rem;">
        <input type="password" name="password" id="password" placeholder=" " required autocomplete="new-password" minlength="6">
        <label for="password">Password</label>
        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button type="submit" class="btn-primary" id="signup-btn">
        Create Account
      </button>
    </form>

    <div class="divider">or</div>

    <p class="auth-footer">
      Already have an account? <a href="/login">Sign in →</a>
    </p>
  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
